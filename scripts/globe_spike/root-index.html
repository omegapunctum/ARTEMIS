<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>ARTEMIS Explorer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07111f; color: #f5f7fb; }
    body { margin: 24px; }
    a { color: #79b5ff; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <p><a id="explorer-link" href="./globe/">Open ARTEMIS Explorer</a></p>
  <noscript><p>The interactive Explorer requires JavaScript.</p></noscript>
  <script>
    const target = new URL('./globe/', window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    document.getElementById('explorer-link').href = target.href;
    window.location.replace(target.href);
  </script>
</body>
</html>
