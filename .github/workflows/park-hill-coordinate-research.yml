name: Park Hill coordinate research
on:
  pull_request:
    paths:
      - "scripts/check_park_hill_coordinate.py"
      - "scripts/requirements-coordinate-research.txt"
      - "scripts/research_tests/test_park_hill_coordinate.py"
      - "docs/work/2026-10-05_PARK_HILL_COORDINATE_CHECK_v1.md"
      - "docs/work/evidence/2026-10-05_park_hill_coordinate_v1.json"
      - ".github/workflows/park-hill-coordinate-research.yml"
  push:
    paths:
      - "scripts/check_park_hill_coordinate.py"
      - "scripts/requirements-coordinate-research.txt"
      - "scripts/research_tests/test_park_hill_coordinate.py"
      - "docs/work/2026-10-05_PARK_HILL_COORDINATE_CHECK_v1.md"
      - "docs/work/evidence/2026-10-05_park_hill_coordinate_v1.json"
      - ".github/workflows/park-hill-coordinate-research.yml"
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: 'pip install --only-binary=:all: -r scripts/requirements-coordinate-research.txt'
      - run: python scripts/check_park_hill_coordinate.py --check
      - run: python -m unittest discover -s scripts/research_tests -p test_park_hill_coordinate.py -v
