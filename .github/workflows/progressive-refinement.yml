name: Progressive Refinement Contract

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/progressive-refinement.yml"
      - "docs/PROGRESSIVE_REFINEMENT_CONTRACT.md"
      - "docs/CONTENT_GOVERNANCE.md"
      - "docs/DEVELOPMENT_OPERATING_SYSTEM.md"
      - "docs/work/2026-08-12_PROGRESSIVE_REFINEMENT_DECISION_v1.md"
      - "fixtures/world_model/refinement/v1/**"
      - "scripts/validate_progressive_refinement_fixtures.py"
      - "tests/test_progressive_refinement_fixtures.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/progressive-refinement.yml"
      - "docs/PROGRESSIVE_REFINEMENT_CONTRACT.md"
      - "docs/CONTENT_GOVERNANCE.md"
      - "docs/DEVELOPMENT_OPERATING_SYSTEM.md"
      - "docs/work/2026-08-12_PROGRESSIVE_REFINEMENT_DECISION_v1.md"
      - "fixtures/world_model/refinement/v1/**"
      - "scripts/validate_progressive_refinement_fixtures.py"
      - "tests/test_progressive_refinement_fixtures.py"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate progressive refinement contract candidate
        run: |
          python scripts/validate_progressive_refinement_fixtures.py
          if grep -q '"status": "READY"' fixtures/world_model/refinement/v1/package.json; then
            python scripts/validate_progressive_refinement_fixtures.py --require-ready
          fi
          pytest -q tests/test_progressive_refinement_fixtures.py
