name: Progressive Refinement Contract

on:
  # Accepted v1 remains reproducible historical evidence. It is intentionally
  # manual while #392 separates immutable semantics from mutable repository
  # routing; it is not part of the read-only Leonardo MVP critical path.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate progressive refinement contract candidate
        run: |
          python scripts/validate_progressive_refinement_fixtures.py
          if grep -q '"status": "READY"' fixtures/world_model/refinement/v1/package.json; then
            python scripts/validate_progressive_refinement_fixtures.py --require-ready
          fi
          pytest -q tests/test_progressive_refinement_fixtures.py
