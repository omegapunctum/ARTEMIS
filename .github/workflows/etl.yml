name: ETL Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  etl-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run pytest
        run: |
          pytest tests/ \
            --ignore=tests/test_auth_redis_integration.py \
            --ignore=tests/test_auth_redis_multi_instance.py \
            --ignore=tests/test_auth_redis_restart.py \
            --ignore=tests/test_moderation_integration.py \
            --ignore=tests/test_uploads_contract.py

      - name: Run dry-run export
        run: |
          python scripts/export_airtable.py --dry-run --out-dir data --max-records 10

      - name: Validate outputs exist
        run: |
          test -f data/_test_features.geojson
          test -f data/_test_id_aliases.json
          test -f data/_test_layers.json
          test -f data/_test_sources.json
          test -f data/_test_media.json
          test -f data/_test_relations.json
          test -f data/_test_validation_report.json
          test -f data/_test_export_meta.json

      - name: Validate GeoJSON structure
        run: |
          python - <<EOF
          import json
          with open("data/_test_features.geojson") as f:
              data = json.load(f)
          assert data["type"] == "FeatureCollection"
          assert isinstance(data["features"], list)
          assert data["features"][0]["properties"]["source_ids"] == ["src_test_reference"]
          assert data["features"][0]["properties"]["media_ids"] == ["media_test_image"]
          assert data["features"][0]["properties"]["relation_ids"] == ["c9f0f895-fb98-4f6f-91f6-7ca4f8d76a33"]
          print("GeoJSON OK")
          EOF

      - name: Validate normalized evidence artifacts
        run: |
          python - <<EOF
          import json
          with open("data/_test_sources.json") as f:
              sources = json.load(f)
          with open("data/_test_media.json") as f:
              media = json.load(f)
          with open("data/_test_relations.json") as f:
              relations = json.load(f)
          assert [item["id"] for item in sources] == ["src_test_reference"]
          assert [item["id"] for item in media] == ["media_test_image"]
          assert [item["id"] for item in relations] == ["c9f0f895-fb98-4f6f-91f6-7ca4f8d76a33"]
          assert relations[0]["source_ids"] == ["src_test_reference"]
          print("Normalized evidence artifacts OK")
          EOF

      - name: Validate export_meta
        run: |
          python - <<EOF
          import json
          with open("data/_test_export_meta.json") as f:
              data = json.load(f)
          assert "records_total_source" in data
          assert "records_exported" in data
          assert data["sources_reviewed"] == 1
          assert data["media_reviewed"] == 1
          assert data["relations_reviewed"] == 1
          assert "errors" in data
          assert data["semantic_gate"]["blocking_errors"] == 0
          assert data["semantic_gate"]["status"] in {"ready", "ready_with_warnings"}
          print("Meta OK")
          EOF

      - name: Validate semantic report
        run: |
          python - <<EOF
          import json
          with open("data/_test_validation_report.json") as f:
              data = json.load(f)
          assert data["schema_version"] == 2
          assert data["blocking_errors_count"] == 0
          assert data["blocking_errors"] == []
          assert data["status"] in {"ready", "ready_with_warnings"}
          print("Semantic report OK")
          EOF
