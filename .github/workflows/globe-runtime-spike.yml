name: Globe Runtime Spike Gate

on:
  push:
    paths:
      - "fixtures/world_model/**"
      - "fixtures/explorer_state/**"
      - "fixtures/render_projection/**"
      - "fixtures/geospatial_assets/**"
      - "fixtures/globe_runtime/**"
      - "scripts/build_render_projection_fixtures.py"
      - "scripts/validate_explorer_state_fixtures.py"
      - "scripts/validate_geospatial_assets.py"
      - "scripts/build_globe_spike.py"
      - "scripts/globe_spike/**"
      - "tests/test_globe_runtime_spike.py"
      - "docs/work/2026-08-08_GLOBE_ENGINE_SPIKE_DECISION_v1.md"
      - "docs/work/2026-08-08_GLOBE_RUNTIME_SPIKE_RUNBOOK_v1.md"
      - "docs/work/2026-08-14_GATE_D_BROWSER_EVIDENCE_v1.md"
      - ".github/workflows/globe-runtime-spike.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "fixtures/world_model/**"
      - "fixtures/explorer_state/**"
      - "fixtures/render_projection/**"
      - "fixtures/geospatial_assets/**"
      - "fixtures/globe_runtime/**"
      - "scripts/build_render_projection_fixtures.py"
      - "scripts/validate_explorer_state_fixtures.py"
      - "scripts/validate_geospatial_assets.py"
      - "scripts/build_globe_spike.py"
      - "scripts/globe_spike/**"
      - "tests/test_globe_runtime_spike.py"
      - "docs/work/2026-08-08_GLOBE_ENGINE_SPIKE_DECISION_v1.md"
      - "docs/work/2026-08-08_GLOBE_RUNTIME_SPIKE_RUNBOOK_v1.md"
      - "docs/work/2026-08-14_GATE_D_BROWSER_EVIDENCE_v1.md"
      - ".github/workflows/globe-runtime-spike.yml"
      - "requirements.txt"

jobs:
  globe-runtime-spike:
    name: Build + validate isolated 3D globe spike
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate renderer-neutral dependencies
        run: |
          python scripts/validate_explorer_state_fixtures.py
          python scripts/build_render_projection_fixtures.py
          python scripts/validate_geospatial_assets.py

      - name: Build isolated Globe artifact
        run: python scripts/build_globe_spike.py --output /tmp/artemis-globe-spike

      - name: Run Globe spike contract tests
        run: pytest -q tests/test_globe_runtime_spike.py

      - name: Smoke-test static artifact serving
        run: |
          python -m http.server 8123 --directory /tmp/artemis-globe-spike >/tmp/artemis-globe-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8123/ | grep -F "ARTEMIS Globe R&D Spike"
          curl -fsS http://127.0.0.1:8123/build-meta.json | python -m json.tool >/dev/null
          curl -fsS http://127.0.0.1:8123/explorer-views.json | python -m json.tool >/dev/null
          curl -fsS http://127.0.0.1:8123/knowledge-index.json | python -m json.tool >/dev/null
          curl -fsS http://127.0.0.1:8123/knowledge-index.json | grep -F "Printed p. 16"

      - name: Execute Globe artifact in headless browser
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chrome/Chromium executable available on the hosted runner" >&2
            exit 1
          fi
          "$BROWSER" --version

          python -m http.server 8124 --directory /tmp/artemis-globe-spike >/tmp/artemis-globe-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          COMMON_BROWSER_ARGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --use-gl=angle
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --run-all-compositor-stages-before-draw
          )
          PROFILE_SPECS=(
            "desktop:1440:900:desktop:false"
            "tablet:1024:768:tablet:false"
            "mobile:500:844:mobile:true"
          )
          PROFILE_URL='http://127.0.0.1:8124/?view=slice&time=cesena-1502-08-10&layers=layer-leonardo-trajectory,layer-engineering-work&item=rp:event:event-leonardo-cesena-survey'

          for SPEC in "${PROFILE_SPECS[@]}"; do
            IFS=: read -r PROFILE WIDTH HEIGHT LAYOUT REDUCED_MOTION <<<"$SPEC"
            EXTRA_ARGS=()
            if [ "$REDUCED_MOTION" = "true" ]; then
              EXTRA_ARGS+=(--force-prefers-reduced-motion=reduce)
            fi
            RUN_URL="$PROFILE_URL&profile=$PROFILE"

            timeout 45s "$BROWSER" \
              "${COMMON_BROWSER_ARGS[@]}" \
              "${EXTRA_ARGS[@]}" \
              --virtual-time-budget=15000 \
              --window-size="$WIDTH,$HEIGHT" \
              --dump-dom \
              "$RUN_URL" \
              > "/tmp/artemis-globe-browser-$PROFILE-dom.html" \
              2> "/tmp/artemis-globe-browser-$PROFILE.log"

            if grep -Fq "ARTEMIS Globe spike failed:" "/tmp/artemis-globe-browser-$PROFILE-dom.html"; then
              cat "/tmp/artemis-globe-browser-$PROFILE-dom.html" >&2
              cat "/tmp/artemis-globe-browser-$PROFILE.log" >&2 || true
              exit 1
            fi

            # These values are injected only after MapLibre's map `load` handler.
            grep -F 'data-artemis-runtime-ready="true"' "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "data-artemis-viewport-profile=\"$PROFILE\"" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "data-artemis-layout-mode=\"$LAYOUT\"" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "data-artemis-viewport-width=\"$WIDTH\"" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "data-artemis-reduced-motion=\"$REDUCED_MOTION\"" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F 'data-artemis-horizontal-overflow="0"' "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F 'data-artemis-unnamed-control-count="0"' "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F 'data-artemis-undersized-target-count="0"' "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "world-slice-leonardo-romagna-1502-v1" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "engine: MapLibre GL JS" "/tmp/artemis-globe-browser-$PROFILE-dom.html"
            grep -F "maplibregl-canvas" "/tmp/artemis-globe-browser-$PROFILE-dom.html"

            timeout 45s "$BROWSER" \
              "${COMMON_BROWSER_ARGS[@]}" \
              "${EXTRA_ARGS[@]}" \
              --virtual-time-budget=10000 \
              --window-size="$WIDTH,$HEIGHT" \
              --screenshot="/tmp/artemis-globe-browser-$PROFILE.png" \
              "$RUN_URL" \
              > "/tmp/artemis-globe-browser-$PROFILE-screenshot.log" \
              2>&1
            test -s "/tmp/artemis-globe-browser-$PROFILE.png"
          done

          # Turn the three DOM probes into one machine-readable evidence artifact.
          # Timing remains diagnostic: virtual-time headless scheduling is not a SLO.
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          artifact = Path("/tmp/artemis-globe-spike")
          contract = json.loads((artifact / "acceptance-profiles.json").read_text())
          thresholds = contract["thresholds"]

          class RootAttributes(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.attributes = None

              def handle_starttag(self, tag, attrs):
                  if tag == "html" and self.attributes is None:
                      self.attributes = dict(attrs)

          results = []
          for expected in contract["profiles"]:
              profile_id = expected["profile_id"]
              parser = RootAttributes()
              parser.feed(Path(f"/tmp/artemis-globe-browser-{profile_id}-dom.html").read_text())
              attrs = parser.attributes or {}

              def value(name):
                  return attrs[f"data-artemis-{name}"]

              actual = {
                  "profile_id": value("viewport-profile"),
                  "layout_mode": value("layout-mode"),
                  "requested_browser_window_css_px": expected["browser_window_css_px"],
                  "viewport_css_px": {
                      "width": int(value("viewport-width")),
                      "height": int(value("viewport-height")),
                  },
                  "prefers_reduced_motion": value("reduced-motion") == "true",
                  "horizontal_overflow_css_px": int(value("horizontal-overflow")),
                  "unnamed_interactive_control_count": int(value("unnamed-control-count")),
                  "undersized_target_count": int(value("undersized-target-count")),
                  "globe_css_px": {
                      "width": int(value("globe-width")),
                      "height": int(value("globe-height")),
                  },
                  "diagnostic_startup_to_idle_ms": value("startup-to-idle-ms"),
                  "diagnostic_average_frame_ms": value("average-frame-ms"),
              }
              assert actual["profile_id"] == profile_id
              assert actual["layout_mode"] == expected["expected_layout_mode"]
              assert actual["viewport_css_px"]["width"] == expected["browser_window_css_px"]["width"]
              assert 0 < actual["viewport_css_px"]["height"] <= expected["browser_window_css_px"]["height"]
              assert actual["prefers_reduced_motion"] is expected["prefers_reduced_motion"]
              assert actual["horizontal_overflow_css_px"] <= thresholds["max_horizontal_overflow_css_px"]
              assert actual["unnamed_interactive_control_count"] <= thresholds["max_unnamed_interactive_controls"]
              assert actual["undersized_target_count"] == 0
              assert actual["globe_css_px"]["width"] >= thresholds["min_globe_width_css_px"]
              assert actual["globe_css_px"]["height"] >= thresholds["min_globe_height_css_px"]
              results.append(actual)

          evidence = {
              "schema_version": "1.0.0",
              "evidence_scope": contract["evidence_scope"],
              "browser_engine": "hosted-runner Chrome/Chromium with SwiftShader",
              "checks": results,
              "limitations": contract["limitations"],
          }
          Path("/tmp/artemis-globe-browser-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n"
          )
          PY

          # Preserve the original semantic and source-chain smoke assertions on the
          # desktop profile while the new profile loop checks layout/accessibility.
          DESKTOP_DOM=/tmp/artemis-globe-browser-desktop-dom.html
          grep -F "explorer-state-leonardo-romagna-1502-gate-d" "$DESKTOP_DOM"
          grep -F "uncertainty-trajectory-route-gaps" "$DESKTOP_DOM"
          grep -F "Manuscript L folio 78r" "$DESKTOP_DOM"
          grep -F "Cronologia vinciana" "$DESKTOP_DOM"
          grep -F "frozen Gate C candidate package · non-public · draft/rejected Claims" "$DESKTOP_DOM"
          grep -F "Terrain: capability path ready" "$DESKTOP_DOM"
          grep -F 'id="startup-ms"' "$DESKTOP_DOM"
          grep -F 'id="frame-sample"' "$DESKTOP_DOM"

          timeout 45s "$BROWSER" \
            "${COMMON_BROWSER_ARGS[@]}" \
            --virtual-time-budget=10000 \
            --window-size=1440,900 \
            --dump-dom \
            'http://127.0.0.1:8124/?time=cesena-1502-08-10&layers=layer-leonardo-trajectory,layer-engineering-work&item=rp:event:event-leonardo-cesena-survey' \
            >/tmp/artemis-globe-interaction-dom.html \
            2>/tmp/artemis-globe-interaction-browser.log
          if grep -Fq "ARTEMIS Globe spike failed:" /tmp/artemis-globe-interaction-dom.html; then
            cat /tmp/artemis-globe-interaction-dom.html >&2
            cat /tmp/artemis-globe-interaction-browser.log >&2 || true
            exit 1
          fi
          grep -F 'data-artemis-temporal-preset="cesena-1502-08-10"' /tmp/artemis-globe-interaction-dom.html
          grep -F 'data-artemis-layer-count="2"' /tmp/artemis-globe-interaction-dom.html
          grep -F 'event-leonardo-cesena-survey' /tmp/artemis-globe-interaction-dom.html
          grep -F 'Cesena source date' /tmp/artemis-globe-interaction-dom.html

      - name: Upload generated Globe artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-globe-runtime-spike
          path: |
            /tmp/artemis-globe-spike
            /tmp/artemis-globe-browser-evidence.json
            /tmp/artemis-globe-browser-*-dom.html
            /tmp/artemis-globe-browser-*.png
          if-no-files-found: error
          retention-days: 7
