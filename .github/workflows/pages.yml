name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        run: pip install jsonschema==4.25.1 pytest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate ARTEMIS Core
        run: |
          python scripts/validate_leonardo_world_slice.py
          python scripts/validate_leonardo_major_life_package.py
          python scripts/build_temporal_map_m2_proof.py
          python scripts/validate_explorer_state_fixtures.py
          python scripts/validate_geospatial_assets.py
          pytest -q \
            tests/test_core_reset_boundary.py \
            tests/test_explorer_state_fixtures.py \
            tests/test_geospatial_assets_contract.py \
            tests/test_globe_repository_boundary.py \
            tests/test_globe_rnd_lifecycle_contract.py \
            tests/test_globe_runtime_spike.py \
            tests/test_leonardo_major_life_package.py \
            tests/test_leonardo_world_slice.py \
            tests/test_render_projection_contract.py \
            tests/test_renderer_parity.py \
            tests/test_temporal_map_m2_proof.py \
            tests/test_uncertainty_fixtures.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare pages artifact
        run: |
          set -euo pipefail
          rm -rf pages_artifact
          mkdir -p pages_artifact/atlas/{css,js,data,icons}
          cp scripts/globe_spike/root-index.html pages_artifact/index.html

          required_files=(
            "index.html"
            "css/tokens.css"
            "css/base.css"
            "css/components/controls.css"
            "css/components/surfaces.css"
            "css/style.css"
            "css/main-screen.css"
            "manifest.json"
            "sw.js"
            "deployment-config.js"
            "icons/icon-192.svg"
            "icons/icon-512.svg"
            "js/auth.js"
            "js/runtime-config.js"
            "js/data.js"
            "js/map.js"
            "js/pwa.js"
            "js/ui.js"
            "js/ui.ugc.js"
            "js/ui.moderation.js"
            "js/ugc.js"
            "js/ux.js"
            "js/safe-dom.js"
            "js/state.js"
            "js/research_slices.js"
            "js/stories.js"
            "js/courses_runtime.js"
            "js/uploads.js"
            "data/features.geojson"
            "data/id_aliases.json"
            "data/layers.json"
            "data/relations.json"
            "data/courses.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required artifact file: $file" >&2
              exit 1
            fi
            mkdir -p "pages_artifact/atlas/$(dirname "$file")"
            cp "$file" "pages_artifact/atlas/$file"
          done

          python - <<'PY'
          from pathlib import Path

          atlas_index = Path("pages_artifact/atlas/index.html")
          atlas_index.write_text(
              atlas_index.read_text(encoding="utf-8").replace(
                  'href="./globe/"', 'href="../globe/"'
              ),
              encoding="utf-8",
          )
          PY

      - name: Build public Globe R&D preview
        run: |
          python scripts/build_globe_spike.py \
            --public-preview \
            --output pages_artifact/globe
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("pages_artifact/globe/build-meta.json").read_text())
          assert metadata["public_pages_entrypoint"] is True
          assert metadata["deployment_mode"] == "public_r_and_d_preview"
          assert metadata["backend_required"] is False
          PY

      - name: Generate public runtime configuration
        env:
          ARTEMIS_API_BASE: ${{ vars.ARTEMIS_API_BASE }}
        run: |
          python scripts/generate_pages_runtime_config.py \
            --output pages_artifact/atlas/deployment-config.js
          node --check pages_artifact/atlas/deployment-config.js

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages_artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
