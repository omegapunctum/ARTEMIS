name: Unified evidence transport
on:
  push:
    branches: [chore/unified-evidence-transport-20261005]
permissions:
  contents: read
jobs:
  diagnostic:
    name: Public numeric native Place diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public failed head
        uses: actions/checkout@v6
        with:
          ref: '114f6df41d0f5193c5f7b6e66f92c470c6914c1b'
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install bounded incumbent browser dependencies
        run: |
          pip install jsonschema==4.25.1
          npm install --prefix /tmp/artemis-browser-tools --no-package-lock --no-save playwright@1.51.1
          node /tmp/artemis-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build only existing public Leonardo profile
        run: python scripts/build_unified_explorer.py --entry-profile leonardo --output /tmp/artemis-diagnostic/globe
      - name: Read allowlisted numeric native diagnostics
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/artemis-diagnostic >/tmp/artemis-diagnostic-server.log 2>&1 &
          DIAGNOSTIC_SERVER_PID=$!
          trap 'kill "$DIAGNOSTIC_SERVER_PID"' EXIT
          node <<'JS'
          const { chromium } = require('/tmp/artemis-browser-tools/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:chromium.executablePath(),headless:true,args:['--headless=new','--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--force-prefers-reduced-motion=reduce']});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:8765/globe/',{waitUntil:'domcontentloaded',timeout:45000});
              const cdp=await context.newCDPSession(page);
              async function evaluate(expression){const response=await cdp.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(response.exceptionDetails)throw new Error('Native diagnostic evaluation failed');return response.result.value;}
              const deadline=Date.now()+60000;let ready=false;
              while(Date.now()<deadline){ready=await evaluate("window.__ARTEMIS_EXPLORER?.ready===true&&document.documentElement.dataset.artemisVisualReady==='true'");if(ready)break;await new Promise(r=>setTimeout(r,100));}
              if(!ready)throw new Error('Native map readiness deadline');
              await evaluate("(async()=>{const m=window.__ARTEMIS_EXPLORER.map;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{m.off('idle',done);reject(new Error('Native idle deadline'));},20000);function done(){clearTimeout(timer);requestAnimationFrame(()=>requestAnimationFrame(resolve));}m.once('idle',done);m.triggerRepaint();});if(!m.loaded()||m.isMoving())throw new Error('Native map not settled');return true;})()");
              async function diagnose(){
                const r=window.__ARTEMIS_EXPLORER,m=r.map,source=await m.getSource('workspace-features').getData();
                const allowed=new Set(r.bundle.leonardo.lifePath.presences.map(p=>p.place_ref));
                if(allowed.size!==9)throw new Error('Public Place allowlist size changed');
                const allowedKeys=new Set([...allowed].map(p=>'place-anchor:'+p));
                const finite=n=>Number.isFinite(n)?n:null;
                const id=value=>typeof value==='number'&&Number.isFinite(value)?value:typeof value==='string'&&(allowedKeys.has(value)||/^\d+$/.test(value))?value:null;
                const flags=state=>({selected:state?.selected===true,current:state?.current===true});
                const box=m.getContainer().getBoundingClientRect();
                const all=m.queryRenderedFeatures({layers:['workspace-points']});
                const rendered=all.filter(f=>allowed.has(f.properties.place_ref)).map(f=>({place:f.properties.place_ref,id:id(f.id),idType:typeof f.id,renderKey:typeof f.properties.render_key==='string'&&allowedKeys.has(f.properties.render_key)?f.properties.render_key:null,state:id(f.id)!==null?flags(m.getFeatureState({source:'workspace-features',id:f.id})):flags(null)}));
                const anchors=[...document.querySelectorAll('.workspace-place-marker')].filter(n=>allowed.has(n.dataset.placeRef)).map(n=>{
                  const bounds=n.getBoundingClientRect(),style=getComputedStyle(n),feature=source.features.find(f=>f.id==='place-anchor:'+n.dataset.placeRef),projected=feature&&m.project(feature.geometry.coordinates);
                  return {place:n.dataset.placeRef,sourceId:feature?.id&&allowedKeys.has(feature.id)?feature.id:null,nativeSourceState:feature?flags(m.getFeatureState({source:'workspace-features',id:feature.id})):flags(null),
                    center:{x:finite(bounds.left+bounds.width/2),y:finite(bounds.top+bounds.height/2)},projected:projected?{x:finite(box.left+projected.x),y:finite(box.top+projected.y)}:null,
                    width:finite(bounds.width),height:finite(bounds.height),opacity:finite(Number(style.opacity)),visibility:['visible','hidden','collapse'].includes(style.visibility)?style.visibility:null,position:['absolute','relative','static','fixed','sticky'].includes(style.position)?style.position:null,
                    originalEligibility:Boolean(feature&&all.some(f=>f.id===feature.id)&&bounds.width>0&&bounds.height>0&&style.visibility!=='hidden'&&style.display!=='none'&&Number(style.opacity)>0)};
                });
                return {scope:'public nine Place IDs and numeric renderer diagnostics only',head:'114f6df41d0f5193c5f7b6e66f92c470c6914c1b',projection:m.getProjection().type==='globe'?'globe':'map',mapBounds:{left:finite(box.left),top:finite(box.top),width:finite(box.width),height:finite(box.height)},nativeRenderedFeatureCount:all.length,rendered,anchors};
              }
              const diagnostic=await evaluate('('+diagnose.toString()+')()');
              console.log('ARTEMIS_POSITION_DIAGNOSTIC '+JSON.stringify(diagnostic));
            }finally{await browser.close();}
          })().catch(()=>{console.error('Bounded public native position diagnostic failed');process.exitCode=1;});
          JS
