name: ARTEMIS Core Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  artemis-core:
    name: Leonardo World Slice + Globe runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        run: pip install jsonschema==4.25.1 pytest

      - name: Validate source-aware Core inputs
        run: |
          python scripts/validate_leonardo_world_slice.py
          python scripts/validate_leonardo_major_life_package.py
          python scripts/build_temporal_map_m2_proof.py
          python scripts/build_temporal_map_m3_proof.py
          python scripts/validate_explorer_state_fixtures.py
          python scripts/validate_geospatial_assets.py

      - name: Build the bounded public-preview artifact
        run: |
          python scripts/build_globe_spike.py \
            --public-preview \
            --output /tmp/artemis-core-preview
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("/tmp/artemis-core-preview/build-meta.json").read_text()
          )
          assert metadata["semantic_dataset"] == "leonardo_gate_c"
          assert metadata["backend_required"] is False
          assert metadata["public_pages_entrypoint"] is True
          assert metadata["capability_path_is_semantic"] is False
          PY

      - name: Run ARTEMIS Core regression tests
        run: |
          pytest -q \
            tests/test_core_reset_boundary.py \
            tests/test_explorer_state_fixtures.py \
            tests/test_geospatial_assets_contract.py \
            tests/test_globe_repository_boundary.py \
            tests/test_globe_rnd_lifecycle_contract.py \
            tests/test_globe_runtime_spike.py \
            tests/test_leonardo_major_life_package.py \
            tests/test_leonardo_world_slice.py \
            tests/test_render_projection_contract.py \
            tests/test_renderer_parity.py \
            tests/test_temporal_map_m2_proof.py \
            tests/test_temporal_map_m3_proof.py \
            tests/test_uncertainty_fixtures.py
