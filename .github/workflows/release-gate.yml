name: ARTEMIS Core Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  artemis-core:
    name: Leonardo World Slice + Globe runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        run: pip install jsonschema==4.25.1 pytest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install bounded browser verification dependencies
        run: |
          npm install --prefix /tmp/artemis-browser-tools --no-package-lock --no-save playwright@1.51.1
          node /tmp/artemis-browser-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Validate source-aware Core inputs
        run: |
          python scripts/validate_leonardo_world_slice.py
          python scripts/validate_leonardo_major_life_package.py
          python scripts/build_temporal_map_m2_proof.py
          python scripts/build_temporal_map_m3_proof.py
          python scripts/validate_explorer_state_fixtures.py
          python scripts/validate_geospatial_assets.py

      - name: Build the bounded public-preview artifact
        run: |
          python scripts/build_globe_spike.py \
            --public-preview \
            --output /tmp/artemis-core-preview
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("/tmp/artemis-core-preview/build-meta.json").read_text()
          )
          assert metadata["semantic_dataset"] == "leonardo_gate_c"
          assert metadata["backend_required"] is False
          assert metadata["public_pages_entrypoint"] is True
          assert metadata["capability_path_is_semantic"] is False
          PY

      - name: Verify Leonardo source-aware research loop in Chromium
        env:
          NODE_PATH: /tmp/artemis-browser-tools/node_modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/artemis-leonardo-browser-evidence
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/artemis-core-preview > /tmp/artemis-leonardo-browser-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          BROWSER="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          for width in 1440 500; do
            timeout 180s node scripts/capture_globe_browser_evidence.mjs \
              --browser "$BROWSER" --url http://127.0.0.1:8765/ \
              --width "$width" --height 900 --timeout-ms 150000 \
              --reduced-motion true --verify-url-state true --source-aware-research true \
              --dom "/tmp/artemis-leonardo-browser-evidence/$width.html" \
              --screenshot "/tmp/artemis-leonardo-browser-evidence/$width.png" \
              --report "/tmp/artemis-leonardo-browser-evidence/$width.json" \
              2> >(tee "/tmp/artemis-leonardo-browser-evidence/$width.log" >&2)
          done

      - name: Attach Leonardo source-aware browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leonardo-source-aware-browser-evidence
          path: /tmp/artemis-leonardo-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Build both entries into the persistent unified Explorer
        run: |
          python scripts/build_unified_explorer.py --entry-profile leonardo --output /tmp/artemis-unified-preview/globe
          python scripts/build_unified_explorer.py --entry-profile roman --output /tmp/artemis-unified-preview/region
          cmp /tmp/artemis-unified-preview/globe/unified-bundle.json /tmp/artemis-unified-preview/region/unified-bundle.json

      - name: Measure paired Explorer performance
        env:
          NODE_PATH: /tmp/artemis-browser-tools/node_modules
        run: |
          set -euo pipefail
          BROWSER="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          timeout 300s node scripts/capture_explorer_performance.mjs \
            --browser "$BROWSER" --artifact /tmp/artemis-unified-preview \
            --baseline-ref 76404197 \
            --output /tmp/artemis-explorer-performance

      - name: Attach Explorer performance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: explorer-performance
          path: /tmp/artemis-explorer-performance/
          if-no-files-found: warn

      - name: Verify native unified layer workspace in Chromium
        env:
          NODE_PATH: /tmp/artemis-browser-tools/node_modules
        run: |
          set -euo pipefail
          BROWSER="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          for width in 1440 500; do
            timeout 300s node scripts/capture_unified_explorer_browser_evidence.mjs \
              --browser "$BROWSER" --artifact /tmp/artemis-unified-preview \
              --width "$width" --height 900 --timeout-ms 270000 \
              --output "/tmp/artemis-unified-browser-evidence/$width" \
              2> >(tee "/tmp/artemis-unified-$width.log" >&2)
          done

      - name: Attach persistent unified Explorer browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-explorer-browser-evidence
          path: |
            /tmp/artemis-unified-browser-evidence/
            /tmp/artemis-unified-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build the non-public ATL conflict review proof
        run: python scripts/build_atl_conflict_proof.py --output /tmp/artemis-atl-conflict-proof

      - name: Verify non-public ATL proof in Chromium
        env:
          NODE_PATH: /tmp/artemis-browser-tools/node_modules
        run: |
          node scripts/capture_atl_conflict_browser_evidence.mjs \
            --proof-dir /tmp/artemis-atl-conflict-proof \
            --output /tmp/artemis-atl-browser-evidence

      - name: Attach ATL browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atl-conflict-browser-evidence
          path: /tmp/artemis-atl-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Attach ATL conflict review proof to PR run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: atl-conflict-review-proof
          path: /tmp/artemis-atl-conflict-proof/

      - name: Run ARTEMIS Core regression tests
        run: |
          pytest -q \
            tests/test_core_reset_boundary.py \
            tests/test_explorer_state_fixtures.py \
            tests/test_geospatial_assets_contract.py \
            tests/test_globe_repository_boundary.py \
            tests/test_globe_rnd_lifecycle_contract.py \
            tests/test_project_state.py \
            tests/test_public_artifact_provenance.py \
            tests/test_globe_runtime_spike.py \
            tests/test_unified_explorer.py \
            tests/test_unified_explorer_browser.py \
            tests/test_temporal_region_proof.py \
            tests/test_leonardo_major_life_package.py \
            tests/test_leonardo_world_slice.py \
            tests/test_render_projection_contract.py \
            tests/test_renderer_parity.py \
            tests/test_temporal_map_m2_proof.py \
            tests/test_temporal_map_m3_proof.py \
            tests/test_uncertainty_fixtures.py \
            tests/test_atl_conflict_proof.py
