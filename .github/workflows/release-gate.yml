name: Release Discipline Gate

on:
  push:
  pull_request:

jobs:
  release-gate:
    name: Structural + semantic release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run migration preflight discipline check
        env:
          AUTH_DATABASE_URL: "sqlite:///:memory:"
        run: python scripts/preflight_migration_check.py

      - name: Run release gate
        # Cross-artifact structural and semantic publish check; full regression remains separate.
        run: python scripts/release_check.py

      - name: Validate renderer-neutral Explorer State contract
        run: |
          python scripts/validate_explorer_state_fixtures.py
          pytest -q tests/test_explorer_state_fixtures.py

      - name: Run concept and repository governance guards
        run: |
          pytest -q \
            tests/test_concept_lock_contract.py \
            tests/test_repository_governance_contract.py \
            tests/test_globe_rnd_lifecycle_contract.py \
            tests/test_pages_runtime_config.py
