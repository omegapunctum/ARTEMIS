name: Release Discipline Gate

on:
  push:
  pull_request:

jobs:
  release-gate:
    name: Structural + semantic release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run migration preflight discipline check
        env:
          AUTH_DATABASE_URL: "sqlite:///:memory:"
        run: python scripts/preflight_migration_check.py

      - name: Run release gate
        # Cross-artifact structural and semantic publish check; full regression remains separate.
        run: python scripts/release_check.py

      - name: Validate renderer-neutral Explorer State contract
        run: |
          python scripts/validate_explorer_state_fixtures.py
          pytest -q tests/test_explorer_state_fixtures.py

      - name: Validate active Leonardo World Slice scope
        run: |
          python scripts/validate_project_state.py
          pytest -q tests/test_project_state.py
          python scripts/validate_leonardo_world_slice.py
          pytest -q tests/test_leonardo_world_slice.py

      - name: Validate Airtable pre-Gate-D shadow curation schema
        run: |
          python scripts/validate_airtable_curation_schema.py --require-empty
          pytest -q \
            tests/test_airtable_pre_gate_d_contract.py \
            tests/test_airtable_curation_schema.py

      - name: Validate Leonardo Airtable shadow-import preflight
        run: |
          python scripts/validate_airtable_leonardo_shadow_preflight.py
          python scripts/build_airtable_leonardo_shadow_plan.py
          pytest -q \
            tests/test_airtable_leonardo_shadow_preflight.py \
            tests/test_airtable_leonardo_shadow_plan.py

      - name: Run concept and repository governance guards
        run: |
          pytest -q \
            tests/test_concept_lock_contract.py \
            tests/test_attractor_refinement_contract.py \
            tests/test_repository_governance_contract.py \
            tests/test_globe_rnd_lifecycle_contract.py \
            tests/test_pages_runtime_config.py
